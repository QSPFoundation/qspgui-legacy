on:
  push:
    tags:
      - 'v*'

name: Release on tag
run-name: Release on tag ${{ github.ref_name }}

permissions:
  contents: read

jobs:
  get_tag_metadata:
    name: Get tag metadata
    runs-on: ubuntu-latest
    outputs:
      annotation: ${{ steps.tag-data.outputs.annotation }}
      clean_tag: ${{ steps.tag-data.outputs.clean_tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Get annotation and cleaned tag
        id: tag-data
        env:
          PREFIX: "v"
        run: |
          if [[ "$GITHUB_REF_NAME" == "$PREFIX"* ]]; then
            CLEAN_TAG="${GITHUB_REF_NAME#$PREFIX}"
          else
            CLEAN_TAG="$GITHUB_REF_NAME"
          fi

          echo "clean_tag=$CLEAN_TAG" >> "$GITHUB_OUTPUT"

          {
            echo 'annotation<<EOF'
            git for-each-ref "$GITHUB_REF" --format '%(contents)'
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

  build_win:
    name: Build ${{ github.ref_name }} (Windows)
    runs-on: ubuntu-latest
    needs: get_tag_metadata
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Build release
        env:
          RELEASE_VER: ${{ needs.get_tag_metadata.outputs.clean_tag }}
        run: ./build_release_windows.sh "$RELEASE_VER"
      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: win-artifacts
          path: dist/*
          retention-days: 1

  build_linux:
    name: Build ${{ github.ref_name }} (Linux ${{ matrix.kind }})
    runs-on: ubuntu-latest
    needs: get_tag_metadata
    strategy:
      matrix:
        include:
          - kind: packages
            script: ./build_packages/pack_linux64.sh
          - kind: appimage
            script: ./build_packages/pack_linux64_AppImage.sh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Build release
        env:
          RELEASE_VER: ${{ needs.get_tag_metadata.outputs.clean_tag }}
          BUILD_SCRIPT: ${{ matrix.script }}
        run: |
          mkdir -p dist
          "$BUILD_SCRIPT"
      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linux-${{ matrix.kind }}-artifacts
          path: dist/*
          retention-days: 1

  build_macos:
    name: Build ${{ github.ref_name }} (MacOS)
    runs-on: macos-latest
    needs: get_tag_metadata
    steps:
      - name: Install dependencies (MacOS)
        run: brew install ninja
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Build release
        env:
          RELEASE_VER: ${{ needs.get_tag_metadata.outputs.clean_tag }}
        run: ./build_release_macos.sh "$RELEASE_VER"
      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos-artifacts
          path: dist/*
          retention-days: 1

  publish_release:
    name: Publish Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    needs: [get_tag_metadata, build_win, build_linux, build_macos]
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist/
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          make_latest: true
          name: ${{ needs.get_tag_metadata.outputs.clean_tag }}
          body: ${{ needs.get_tag_metadata.outputs.annotation }}
          files: dist/*